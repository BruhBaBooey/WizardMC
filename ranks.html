<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Wizard MC - Ranks</title>

    <!-- GLOBAL CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- RANKS CSS -->
    <link rel="stylesheet" href="assets/css/ranks.css">

</head>

<body>

    <!-- BACK BUTTON -->
    <a href="index.html" class="back-button">Back</a>
    
    <!-- PAGE CONTAINER -->
    <main class="page-container ranks-container">

        <!-- PAGE TITLE -->
        <section class="ranks-header">

            <h1 class="ranks-title minecraft-glow">
                RANKS
            </h1>

        </section>

    <!-- RANKS GRID -->
    <section class="ranks-grid">

        
        <!-- DRAGON -->
        <div class="rank-card dragon-rank">

            <img
                src="assets/images/dragon-rank.png"
                alt="Dragon Rank"
                class="rank-image"
            >

            <p class="rank-price">
                ₹349
            </p>

            <div class="cart-controls">

                <button class="add-button">
                    ADD
                </button>

                <div class="quantity-controls">

                    <button class="quantity-btn minus-btn">
                        -
                    </button>

                    <span class="quantity-text">
                        1
                    </span>

                    <button class="quantity-btn plus-btn">
                        +
                    </button>

                </div>

            </div>

        </div>

        <!-- ARCANE -->
        <div class="rank-card">

            <img
                src="assets/images/arcane-rank.png"
                alt="Arcane Rank"
                class="rank-image"
            >

            <p class="rank-price">
                ₹79
            </p>

            <div class="cart-controls">

                <button class="add-button">
                    ADD
                </button>

                <div class="quantity-controls">

                    <button class="quantity-btn minus-btn">
                        -
                    </button>

                    <span class="quantity-text">
                        1
                    </span>

                    <button class="quantity-btn plus-btn">
                        +
                    </button>

                </div>

            </div>

        </div>

        <!-- WARLORD -->
        <div class="rank-card">

            <img
                src="assets/images/warlord-rank.png"
                alt="Warlord Rank"
                class="rank-image"
            >

            <p class="rank-price">
                ₹149
            </p>

            <div class="cart-controls">

                <button class="add-button">
                    ADD
                </button>

                <div class="quantity-controls">

                    <button class="quantity-btn minus-btn">
                        -
                    </button>

                    <span class="quantity-text">
                        1
                    </span>

                    <button class="quantity-btn plus-btn">
                        +
                    </button>

                </div>

            </div>

        </div>

        <!-- CELESTIAL -->
        <div class="rank-card">

            <img
                src="assets/images/celestial-rank.png"
                alt="Celestial Rank"
                class="rank-image"
            >

            <p class="rank-price">
                ₹219
            </p>

            <div class="cart-controls">

                <button class="add-button">
                    ADD
                </button>

                <div class="quantity-controls">

                    <button class="quantity-btn minus-btn">
                        -
                    </button>

                    <span class="quantity-text">
                        1
                    </span>

                    <button class="quantity-btn plus-btn">
                        +
                    </button>

                </div>

            </div>

        </div>

        <!-- IMMORTAL -->
        <div class="rank-card">

            <img
                src="assets/images/immortal-rank.png"
                alt="Immortal Rank"
                class="rank-image"
            >

            <p class="rank-price">
                ₹299
            </p>

            <div class="cart-controls">

                <button class="add-button">
                    ADD
                </button>

                <div class="quantity-controls">

                    <button class="quantity-btn minus-btn">
                        -
                    </button>

                    <span class="quantity-text">
                        1
                    </span>

                    <button class="quantity-btn plus-btn">
                        +
                    </button>

                </div>

            </div>

        </div>

    </section>

    </main>

    <!-- =========================
        LOGIN BUTTON
    ========================= -->

    <button class="login-btn-top" id="loginBtn" onclick="showLogin()">LOGIN</button>

    <!-- =========================
        CART BUTTON
    ========================= -->

    <button
        class="cart-toggle"
        onclick="toggleCart()"
    >
        CART
    </button>

    <!-- =========================
        SIDEBAR CART
    ========================= -->

    <div
        class="cart-sidebar"
        id="cartSidebar"
    >

        <!-- HEADER -->

        <div class="cart-header">

            <h2>
                CART
            </h2>

            <button
                class="close-cart"
                onclick="toggleCart()"
            >
                ✕
            </button>

        </div>

        <!-- CART ITEMS -->

        <div id="cartItems">

        </div>

        <!-- FOOTER -->

        <div class="cart-footer">

            <div class="cart-total-row">

                <span>
                    TOTAL
                </span>

                <span id="cartTotal">
                    ₹0
                </span>

            </div>

        </div>

        <button
            class="checkout-btn"
            onclick="checkout()"
        >
            CHECKOUT
        </button>
    </div>

    <!-- =========================
        PAYMENT MODAL
    ========================= -->

    <div
        class="payment-modal"
        id="paymentModal"
    >

        <div class="payment-box">

            <h2 class="minecraft-glow">
                Scan To Pay
            </h2>

            <p
                id="upiAmount"
                class="rank-price"
            >
                ₹0
            </p>

            <img
                id="upiQrImage"
                class="upi-qr"
                src=""
                alt="UPI QR"
            >

            <p
                class="upi-id"
                id="upiIdText"
            >
                gareebjeetpatil@fam
            </p>

            <div style="display:flex;gap:10px;justify-content:center;margin-top:20px;">
                <button class="close-button cancel-btn" onclick="closePaymentCancel()">CANCEL</button>
                <button class="close-button paid-btn" onclick="confirmPayment()">I HAVE PAID</button>
            </div>

        </div>

    </div>

    <!-- =========================
        LOGIN MODAL
    ========================= -->

    <div class="login-modal" id="loginModal">
        <div class="login-box">
            <h2 class="minecraft-glow">LOGIN</h2>
            <input type="text" id="ignInput" class="login-input" placeholder="MC Username" autocomplete="off">
            
            <!-- CUSTOM VERSION DROPDOWN -->
            <div class="custom-select" id="versionSelect">
                <div class="custom-select-trigger">Version</div>
                <div class="custom-select-options">
                    <div class="custom-select-option selected" data-value="java">Java Edition</div>
                    <div class="custom-select-option" data-value="bedrock">Bedrock/PE</div>
                </div>
            </div>
            
            <input type="text" id="discordInput" class="login-input" placeholder="Discord Username" autocomplete="off">
            <button class="login-submit-btn" id="signinBtn">SIGN IN</button>
        </div>
    </div>

    <!-- =========================
        LOGOUT MODAL
    ========================= -->

    <div class="logout-modal" id="logoutModal">
        <div class="logout-box">
            <h2 class="minecraft-glow">LOGOUT</h2>
            <p class="logout-text">Would you like to logout?</p>
            <div class="logout-buttons">
                <button class="logout-confirm-btn" id="logoutBtn">LOGOUT</button>
                <button class="logout-cancel-btn" id="logoutCancelBtn">CANCEL</button>
            </div>
        </div>
    </div>

    <!-- =========================
        TOAST
    ========================= -->

    <div id="toast">
        Your cart is empty
    </div>

    <!-- PAGE CONFIG FIRST -->
    <script src="assets/js/ranks.js"></script>

    <!-- THEN SHARED FUNCTIONS -->
    <script src="assets/js/shared.js"></script>

</body>

</html>
