<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Wizard MC</title>

    <!-- GLOBAL CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- LANDING PAGE CSS -->
    <link rel="stylesheet" href="assets/css/landing.css">
</head>
<body>

    <!-- MAIN LANDING CONTAINER -->
    <main class="landing-container">

        <!-- SERVER TITLE -->
        <section class="hero-section">

            <!-- CHANGE SERVER NAME HERE -->
            <h1 class="server-title">WIZARD MC</h1>

            <!-- SERVER INFO -->
            <div class="server-info">

                <!-- CHANGE SERVER IP HERE -->
                <p class="copy-text" data-copy="play.wizardmc.online">
                    IP: play.wizardmc.online
                </p>

                <!-- CHANGE SERVER PORT HERE -->
                <p class="copy-text" data-copy="00000">
                    Port: 00000
                </p>

            </div>

        </section>

        <!-- STORE BUTTONS -->
        <section class="store-section">

            <!--
                GRID SETTINGS:
                Add/remove cards freely.
                Grid automatically adapts.
            -->

            <div class="store-grid">

                <!-- RANKS -->
                <div class="store-card">
                    <h2 class="minecraft-glow">Ranks</h2>
                    <a href="ranks.html" class="store-button">
                        Buy
                    </a>
                </div>

                <!-- KEYS -->
                <div class="store-card">
                    <h2 class="minecraft-glow">Keys</h2>
                    <a href="keys.html" class="store-button">
                        Buy
                    </a>
                </div>

                <!-- KITS -->
                <div class="store-card">
                    <h2 class="minecraft-glow">Kits</h2>
                    <a href="kits.html" class="store-button">
                        Buy
                    </a>
                </div>

                <!-- MONEY -->
                <div class="store-card">
                    <h2 class="minecraft-glow"  >Money</h2>
                    <a href="money.html" class="store-button">
                        Buy
                    </a>
                </div>

            </div>

        </section>

        <!-- SUPPORT SECTION -->
        <section class="support-section">

            <p class="support-text">
                For more info join our discord server
            </p>

            <!-- CHANGE DISCORD LINK HERE -->
            <a 
                href="https://discord.gg/example"
                target="_blank"
                class="discord-link"
            >
                Wizard MC Discord
            </a>

        </section>

    </main>

    <!-- LANDING PAGE JS -->
    <script src="assets/js/landing.js"></script>

</body>
</html>
