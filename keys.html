<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizard MC - Keys</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/keys.css">
</head>
<body>
    <a href="index.html" class="back-button">Back</a>
    
    <main class="page-container ranks-container">
        <section class="ranks-header">
            <h1 class="ranks-title minecraft-glow">KEYS</h1>
        </section>
        <section class="ranks-grid">
            <div class="rank-card dragon-rank">
                <img src="assets/images/dragon-key.png" alt="Dragon Key" class="rank-image">
                <p class="rank-price">₹69</p>
                <div class="cart-controls">
                    <button class="add-button">ADD</button>
                    <div class="quantity-controls">
                        <button class="quantity-btn minus-btn">-</button>
                        <span class="quantity-text">1</span>
                        <button class="quantity-btn plus-btn">+</button>
                    </div>
                </div>
            </div>
            <div class="rank-card">
                <img src="assets/images/arcane-key.png" alt="Arcane Key" class="rank-image">
                <p class="rank-price">₹19</p>
                <div class="cart-controls">
                    <button class="add-button">ADD</button>
                    <div class="quantity-controls">
                        <button class="quantity-btn minus-btn">-</button>
                        <span class="quantity-text">1</span>
                        <button class="quantity-btn plus-btn">+</button>
                    </div>
                </div>
            </div>
            <div class="rank-card">
                <img src="assets/images/warlord-key.png" alt="Warlord Key" class="rank-image">
                <p class="rank-price">₹29</p>
                <div class="cart-controls">
                    <button class="add-button">ADD</button>
                    <div class="quantity-controls">
                        <button class="quantity-btn minus-btn">-</button>
                        <span class="quantity-text">1</span>
                        <button class="quantity-btn plus-btn">+</button>
                    </div>
                </div>
            </div>
            <div class="rank-card">
                <img src="assets/images/celestial-key.png" alt="Celestial Key" class="rank-image">
                <p class="rank-price">₹39</p>
                <div class="cart-controls">
                    <button class="add-button">ADD</button>
                    <div class="quantity-controls">
                        <button class="quantity-btn minus-btn">-</button>
                        <span class="quantity-text">1</span>
                        <button class="quantity-btn plus-btn">+</button>
                    </div>
                </div>
            </div>
            <div class="rank-card">
                <img src="assets/images/immortal-key.png" alt="Immortal Key" class="rank-image">
                <p class="rank-price">₹49</p>
                <div class="cart-controls">
                    <button class="add-button">ADD</button>
                    <div class="quantity-controls">
                        <button class="quantity-btn minus-btn">-</button>
                        <span class="quantity-text">1</span>
                        <button class="quantity-btn plus-btn">+</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- =========================
        LOGIN BUTTON
    ========================= -->

    <button class="login-btn-top" id="loginBtn" onclick="showLogin()">LOGIN</button>

    <!-- =========================
        CART BUTTON
    ========================= -->

    <button class="cart-toggle" onclick="toggleCart()">CART</button>

    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2>CART</h2>
            <button class="close-cart" onclick="toggleCart()">✕</button>
        </div>
        <div id="cartItems"></div>
        <div class="cart-footer">
            <div class="cart-total-row">
                <span>TOTAL</span>
                <span id="cartTotal">₹0</span>
            </div>
        </div>
        <button class="checkout-btn" onclick="checkout()">CHECKOUT</button>
    </div>

    <div class="payment-modal" id="paymentModal">
        <div class="payment-box">
            <h2 class="minecraft-glow">Scan To Pay</h2>
            <p id="upiAmount" class="rank-price">₹0</p>
            <img id="upiQrImage" class="upi-qr" src="" alt="UPI QR">
            <p class="upi-id" id="upiIdText">gareebjeetpatil@fam</p>
            <button class="close-button" id="closeModal">Close</button>
        </div>
    </div>

    <!-- =========================
        LOGIN MODAL
    ========================= -->

    <div class="login-modal" id="loginModal">
        <div class="login-box">
            <h2 class="minecraft-glow">LOGIN</h2>
            <input type="text" id="ignInput" class="login-input" placeholder="MC Username" autocomplete="off">
            
            <!-- CUSTOM VERSION DROPDOWN -->
            <div class="custom-select" id="versionSelect">
                <div class="custom-select-trigger">Version</div>
                <div class="custom-select-options">
                    <div class="custom-select-option selected" data-value="java">Java Edition</div>
                    <div class="custom-select-option" data-value="bedrock">Bedrock/PE</div>
                </div>
            </div>
            
            <input type="text" id="discordInput" class="login-input" placeholder="Discord Username" autocomplete="off">
            <button class="login-submit-btn" id="signinBtn">SIGN IN</button>
        </div>
    </div>

    <!-- =========================
        LOGOUT MODAL
    ========================= -->

    <div class="logout-modal" id="logoutModal">
        <div class="logout-box">
            <h2 class="minecraft-glow">LOGOUT</h2>
            <p class="logout-text">Would you like to logout?</p>
            <div class="logout-buttons">
                <button class="logout-confirm-btn" id="logoutBtn">LOGOUT</button>
                <button class="logout-cancel-btn" id="logoutCancelBtn">CANCEL</button>
            </div>
        </div>
    </div>

    <div id="toast">Your cart is empty</div>
    
    <!-- PAGE CONFIG FIRST -->
    <script src="assets/js/keys.js"></script>

    <!-- THEN SHARED FUNCTIONS -->
    <script src="assets/js/shared.js"></script>

</body>
</html>
