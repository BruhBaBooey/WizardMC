<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Wizard MC - Ranks</title>

    <!-- GLOBAL CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- RANKS CSS -->
    <link rel="stylesheet" href="assets/css/keys.css">

</head>

<body>

    <!-- BACK BUTTON -->

    <a
        href="index.html"
        class="back-button"
    >
        Back    
    </a>

    <!-- PAGE CONTAINER -->
    <main class="page-container ranks-container">

        <!-- PAGE TITLE -->
        <section class="ranks-header">

            <h1 class="ranks-title minecraft-glow">
                KEYS
            </h1>

        </section>

        <!-- KEYS GRID -->
        <section class="ranks-grid">

            <!-- DRAGON -->
            <div class="rank-card dragon-rank">

                <img
                    src="assets/images/temp-img.png"
                    alt="Dragon Key"
                    class="rank-image"
                >

                <p class="rank-price">
                    ₹220
                </p>
                
                <div class="cart-controls">

                    <button class="add-button">
                        ADD
                    </button>

                    <div class="quantity-controls">

                        <button class="quantity-btn minus-btn">
                            -
                        </button>

                        <span class="quantity-text">
                            1
                        </span>

                        <button class="quantity-btn plus-btn">
                            +
                        </button>

                    </div>

                </div>
            </div>

            <!-- ARCANE -->
            <div class="rank-card">

                <img
                    src="assets/images/temp-img.png"
                    alt="Arcane Key"
                    class="rank-image"
                >

                <p class="rank-price">
                    ₹50
                </p>
                
                <div class="cart-controls">

                    <button class="add-button">
                        ADD
                    </button>

                    <div class="quantity-controls">

                        <button class="quantity-btn minus-btn">
                            -
                        </button>

                        <span class="quantity-text">
                            1
                        </span>

                        <button class="quantity-btn plus-btn">
                            +
                        </button>

                    </div>

                </div>

            </div>

            <!-- WARLORD -->
            <div class="rank-card">

                <img
                    src="assets/images/temp-img.png"
                    alt="Warlord Key"
                    class="rank-image"
                >

                <p class="rank-price">
                    ₹80
                </p>
                
                <div class="cart-controls">

                    <button class="add-button">
                        ADD
                    </button>

                    <div class="quantity-controls">

                        <button class="quantity-btn minus-btn">
                            -
                        </button>

                        <span class="quantity-text">
                            1
                        </span>

                        <button class="quantity-btn plus-btn">
                            +
                        </button>

                    </div>

                </div>
            </div>

            <!-- CELESTIAL -->
            <div class="rank-card">

                <img
                    src="assets/images/temp-img.png"
                    alt="Celestial Key"
                    class="rank-image"
                >

                <p class="rank-price">
                    ₹120
                </p>
                
                <div class="cart-controls">

                    <button class="add-button">
                        ADD
                    </button>

                    <div class="quantity-controls">

                        <button class="quantity-btn minus-btn">
                            -
                        </button>

                        <span class="quantity-text">
                            1
                        </span>

                        <button class="quantity-btn plus-btn">
                            +
                        </button>

                    </div>

                </div>
            </div>

            <!-- IMMORTAL -->
            <div class="rank-card">

                <img
                    src="assets/images/temp-img.png"
                    alt="Immortal Key"
                    class="rank-image"
                >

                <p class="rank-price">
                    ₹160
                </p>
                
                <div class="cart-controls">

                    <button class="add-button">
                        ADD
                    </button>

                    <div class="quantity-controls">

                        <button class="quantity-btn minus-btn">
                            -
                        </button>

                        <span class="quantity-text">
                            1
                        </span>

                        <button class="quantity-btn plus-btn">
                            +
                        </button>

                    </div>

                </div>
            </div>

        </section>

    </main>

        <!-- =========================
            CART BUTTON
        ========================= -->

        <button
            class="cart-toggle"
            onclick="toggleCart()"
        >
            &lt; CART
        </button>

        <!-- =========================
            SIDEBAR CART
        ========================= -->

        <div
            class="cart-sidebar"
            id="cartSidebar"
        >

            <!-- HEADER -->

            <div class="cart-header">

                <h2>
                    CART
                </h2>

                <button
                    class="close-cart"
                    onclick="toggleCart()"
                >
                    ✕
                </button>

            </div>

            <!-- CART ITEMS -->

            <div id="cartItems">

            </div>

            <!-- FOOTER -->

            <div class="cart-footer">

                <div class="cart-total-row">

                    <span>
                        TOTAL
                    </span>

                    <span id="cartTotal">
                        ₹0
                    </span>

                </div>

            </div>

        <button
            class="checkout-btn"
            onclick="checkout()"
        >
            CHECKOUT
        </button>
        
        </div>

    <!-- =========================
        PAYMENT MODAL
    ========================= -->

    <div
        class="payment-modal"
        id="paymentModal"
    >

        <div class="payment-box">

            <h2 class="minecraft-glow">
                Scan To Pay
            </h2>

            <p
                id="upiAmount"
                class="rank-price"
            >
                ₹0
            </p>

            <img
                id="upiQrImage"
                class="upi-qr"
                src=""
                alt="UPI QR"
            >

            <p
                class="upi-id"
                id="upiIdText"
            >
                gareebjeetpatil@fam
            </p>

            <button
                class="close-button"
                id="closeModal"
            >
                Close
            </button>

        </div>

    </div>

    <!-- =========================
        TOAST
    ========================= -->

    <div id="toast">
        Your cart is empty
    </div>

    <!-- RANKS JS -->
    <script src="assets/js/keys.js"></script>

</body>

</html>
