<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizard MC - Kits</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/kits.css">
</head>
<body>
    <a href="index.html" class="back-button">Back</a>
    
    <main class="page-container ranks-container">
        <section class="ranks-header">
            <h1 class="ranks-title minecraft-glow">KITS</h1>
        </section>
        <section class="ranks-grid">
            <div class="rank-card dragon-rank">
                <img src="assets/images/dragon-kit.png" alt="Dragon Kit" class="rank-image">
                <p class="rank-price">₹220</p>
                <div class="cart-controls">
                    <button class="add-button">ADD</button>
                    <div class="quantity-controls">
                        <button class="quantity-btn minus-btn">-</button>
                        <span class="quantity-text">1</span>
                        <button class="quantity-btn plus-btn">+</button>
                    </div>
                </div>
            </div>
            <div class="rank-card">
                <img src="assets/images/arcane-kit.png" alt="Arcane Kit" class="rank-image">
                <p class="rank-price">₹50</p>
                <div class="cart-controls">
                    <button class="add-button">ADD</button>
                    <div class="quantity-controls">
                        <button class="quantity-btn minus-btn">-</button>
                        <span class="quantity-text">1</span>
                        <button class="quantity-btn plus-btn">+</button>
                    </div>
                </div>
            </div>
            <div class="rank-card">
                <img src="assets/images/warlord-kit.png" alt="Warlord Kit" class="rank-image">
                <p class="rank-price">₹80</p>
                <div class="cart-controls">
                    <button class="add-button">ADD</button>
                    <div class="quantity-controls">
                        <button class="quantity-btn minus-btn">-</button>
                        <span class="quantity-text">1</span>
                        <button class="quantity-btn plus-btn">+</button>
                    </div>
                </div>
            </div>
            <div class="rank-card">
                <img src="assets/images/celestial-kit.png" alt="Celestial Kit" class="rank-image">
                <p class="rank-price">₹120</p>
                <div class="cart-controls">
                    <button class="add-button">ADD</button>
                    <div class="quantity-controls">
                        <button class="quantity-btn minus-btn">-</button>
                        <span class="quantity-text">1</span>
                        <button class="quantity-btn plus-btn">+</button>
                    </div>
                </div>
            </div>
            <div class="rank-card">
                <img src="assets/images/immortal-kit.png" alt="Immortal Kit" class="rank-image">
                <p class="rank-price">₹160</p>
                <div class="cart-controls">
                    <button class="add-button">ADD</button>
                    <div class="quantity-controls">
                        <button class="quantity-btn minus-btn">-</button>
                        <span class="quantity-text">1</span>
                        <button class="quantity-btn plus-btn">+</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <button class="cart-toggle" onclick="toggleCart()">CART</button>

    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2>CART</h2>
            <button class="close-cart" onclick="toggleCart()">✕</button>
        </div>
        <div id="cartItems"></div>
        <div class="cart-footer">
            <div class="cart-total-row">
                <span>TOTAL</span>
                <span id="cartTotal">₹0</span>
            </div>
        </div>
        <button class="checkout-btn" onclick="checkout()">CHECKOUT</button>
    </div>

    <div class="payment-modal" id="paymentModal">
        <div class="payment-box">
            <h2 class="minecraft-glow">Scan To Pay</h2>
            <p id="upiAmount" class="rank-price">₹0</p>
            <img id="upiQrImage" class="upi-qr" src="" alt="UPI QR">
            <p class="upi-id" id="upiIdText">gareebjeetpatil@fam</p>
            <button class="close-button" id="closeModal">Close</button>
        </div>
    </div>

    <div id="toast">Your cart is empty</div>

    <!-- PAGE CONFIG FIRST -->
    <script src="assets/js/kits.js"></script>

    <!-- THEN SHARED FUNCTIONS -->
    <script src="assets/js/shared.js"></script>

</body>
</html>
