<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Wizard MC</title>

    <!-- GLOBAL CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- LANDING PAGE CSS -->
    <link rel="stylesheet" href="assets/css/landing.css">
</head>
<body>

    <!-- MAIN LANDING CONTAINER -->
    <main class="page-container landing-container">

        <!-- LOGIN BUTTON -->
        <button class="login-btn-top" id="loginBtn" onclick="showLogin()">LOGIN</button>

        <!-- SERVER TITLE -->
        <section class="hero-section">

            <!-- CHANGE SERVER NAME HERE -->
            <h1 class="server-title">WIZARDMC</h1>

            <!-- SERVER INFO -->
            <div class="server-info">

                <!-- CHANGE SERVER IP HERE -->
                <p>
                    IP:
                    <span class="copy-text" data-copy="play.wizardmc.online">
                        cosmic1.lithiumcloud.fun
                    </span>
                </p>

                <!-- CHANGE SERVER PORT HERE -->
                <p>
                    Port:
                    <span class="copy-text" data-copy="00000">
                        25565
                    </span>
                </p>

            </div>

        </section>

        <!-- STORE BUTTONS -->
        <section class="store-section">

            <div class="store-grid">

                <!-- RANKS -->
                <div class="store-card">
                    <h2 class="minecraft-glow">Ranks</h2>
                    <a href="ranks.html" class="store-button">Buy</a>
                </div>

                <!-- KEYS -->
                <div class="store-card">
                    <h2 class="minecraft-glow">Keys</h2>
                    <a href="keys.html" class="store-button">Buy</a>
                </div>

                <!-- KITS -->
                <div class="store-card">
                    <h2 class="minecraft-glow">Kits</h2>
                    <a href="kits.html" class="store-button">Buy</a>
                </div>

                <!-- MONEY -->
                <div class="store-card">
                    <h2 class="minecraft-glow">Money</h2>
                    <a href="money.html" class="store-button">Buy</a>
                </div>

            </div>

        </section>

        <!-- SUPPORT SECTION -->
        <section class="support-section">

            <p class="support-text">Join our discord server</p>
            <a href="https://discord.gg/UeTj2xv6s" target="_blank" class="discord-link">WizardMC Discord</a>

        </section>

    </main>

    <!-- =========================
        LOGIN MODAL
    ========================= -->

    <div class="login-modal" id="loginModal">
        <div class="login-box">
            <h2 class="minecraft-glow">LOGIN</h2>
            <input type="text" id="ignInput" class="login-input" placeholder="MC Username" autocomplete="off">
            
            <!-- CUSTOM VERSION DROPDOWN -->
            <div class="custom-select" id="versionSelect">
                <div class="custom-select-trigger">Version</div>
                <div class="custom-select-options">
                    <div class="custom-select-option selected" data-value="java">Java Edition</div>
                    <div class="custom-select-option" data-value="bedrock">Bedrock/PE</div>
                </div>
            </div>
            
            <input type="text" id="discordInput" class="login-input" placeholder="Discord Username" autocomplete="off">
            <button class="login-submit-btn" id="signinBtn">SIGN IN</button>
        </div>
    </div>

    <!-- =========================
        LOGOUT MODAL
    ========================= -->

    <div class="logout-modal" id="logoutModal">
        <div class="logout-box">
            <h2 class="minecraft-glow">LOGOUT</h2>
            <p class="logout-text">Would you like to logout?</p>
            <div class="logout-buttons">
                <button class="logout-confirm-btn" id="logoutBtn">LOGOUT</button>
                <button class="logout-cancel-btn" id="logoutCancelBtn">CANCEL</button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast"></div>

    <!-- LANDING PAGE JS -->
    <script src="assets/js/landing.js"></script>

</body>
</html>
